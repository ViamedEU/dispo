  <style>
    /* Dispo-Portal: ein Login, vier Reiter. Die Seiten bleiben eigenständig und laufen hier als Rahmen
       (gleiche Adresse viamedeu.github.io, darum teilen sie die PIN über sessionStorage). Serien fragt zusätzlich ein eigenes Passwort ab. */
    :root { --tinte: #14231a; --text: #2c3a31; --leise: #6b7a70; --flaeche: #eef5f0; --gruen: #2e9a3e; --gruen-dunkel: #0f6b4f; --rot: #dc2626; --leiste: 64px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--flaeche); color: var(--text); -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    button { font: inherit; }

    .logo { width: 50px; height: 50px; border-radius: 15px; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,0.15); }
    .logo img { width: 78%; height: auto; display: block; }

    /* PIN */
    .pin-seite { min-height: 100%; display: grid; place-items: center; padding: 1.25rem; }
    .pin-karte { width: 100%; max-width: 400px; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(20,50,30,0.15); overflow: hidden; text-align: center; }
    .pin-kopf { color: #fff; padding: 1.6rem 1.4rem 2.6rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .pin-kopf .logo { margin: 0 auto 0.8rem; }
    .pin-kopf h1 { font-size: 1.45rem; font-weight: 800; }
    .pin-kopf p { font-size: 0.88rem; opacity: 0.92; margin-top: 0.2rem; }
    .pin-chips { display: flex; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.9rem; }
    .pin-chips span { background: rgba(255,255,255,0.18); border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 0.78rem; font-weight: 700; }
    .pin-form { padding: 0 1.4rem 1.5rem; margin-top: -1.6rem; }
    .pin-form input { width: 100%; height: 60px; border-radius: 16px; border: 2px solid transparent; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,0.12); text-align: center; font-size: 1.6rem; letter-spacing: 0.4em; font-weight: 800; color: var(--tinte); }
    .pin-form input:focus { outline: none; border-color: var(--gruen); }
    .pin-form input::placeholder { letter-spacing: 0.08em; font-size: 1.05rem; font-weight: 600; color: #a3b1a8; }
    .knopf { width: 100%; height: 56px; margin-top: 0.9rem; border: none; border-radius: 16px; color: #fff; font-size: 1.05rem; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, var(--gruen) 0%, #5aaf34 100%); box-shadow: 0 10px 24px rgba(46,154,62,0.35); }
    .knopf:disabled { opacity: 0.6; cursor: wait; }
    .fehler { color: var(--rot); font-weight: 700; font-size: 0.9rem; min-height: 1.3em; margin-top: 0.7rem; }
    .hinweis { margin-top: 0.2rem; font-size: 0.8rem; color: var(--leise); }

    /* Portal */
    .portal { height: 100%; display: flex; flex-direction: column; }
    .leiste { flex: none; display: flex; align-items: center; gap: 0.9rem; min-height: var(--leiste); padding: 0.55rem max(1rem, env(safe-area-inset-right)) 0.55rem max(1rem, env(safe-area-inset-left)); color: #fff; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); box-shadow: 0 4px 18px rgba(15,107,79,0.25); position: relative; z-index: 2; }
    .leiste .logo { width: 40px; height: 40px; border-radius: 12px; }
    .marke { line-height: 1.15; flex: none; }
    .marke strong { display: block; font-size: 1.05rem; font-weight: 800; }
    .marke small { font-size: 0.76rem; opacity: 0.9; }
    .reiter { display: flex; gap: 0.35rem; background: rgba(0,0,0,0.14); padding: 0.3rem; border-radius: 999px; margin: 0 auto; }
    .reiter button { display: inline-flex; align-items: center; gap: 0.45rem; border: none; cursor: pointer; border-radius: 999px; padding: 0.55rem 1.05rem; background: transparent; color: #fff; font-weight: 750; font-size: 0.95rem; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    .reiter button:hover { background: rgba(255,255,255,0.14); }
    .reiter button.an { background: #fff; color: var(--gruen-dunkel); box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
    .reiter svg { width: 18px; height: 18px; flex: none; }
    .rechts { display: flex; align-items: center; gap: 0.45rem; flex: none; }
    .hell { border: none; cursor: pointer; background: rgba(255,255,255,0.18); color: #fff; border-radius: 999px; height: 38px; padding: 0 0.95rem; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.35rem; }
    .hell:hover { background: rgba(255,255,255,0.28); }
    .hell svg { width: 17px; height: 17px; }
    .rund { width: 38px; padding: 0; justify-content: center; }

    .buehne { flex: 1; position: relative; min-height: 0; }
    .buehne iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--flaeche); }
    .laden { position: absolute; inset: 0; display: grid; place-items: center; background: var(--flaeche); z-index: 1; }
    .spinner { width: 46px; height: 46px; border-radius: 50%; border: 5px solid #d6e6da; border-top-color: var(--gruen); animation: dreh 0.8s linear infinite; }
    @keyframes dreh { to { transform: rotate(360deg); } }

    .demo { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); background: #f59e0b; color: #fff; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.1em; padding: 0.25rem 0.7rem; border-radius: 999px; z-index: 9; pointer-events: none; }

    /* Handy / schmal: Reiter in eine eigene Zeile */
    @media (max-width: 760px) {
      .leiste { flex-wrap: wrap; gap: 0.6rem; }
      .marke { flex: 1; }
      .reiter { order: 3; width: 100%; margin: 0; }
      .reiter button { flex: 1; justify-content: center; padding: 0.55rem 0.4rem; font-size: 0.88rem; }
      .abmelden-text { display: none; }
      .abmelden { width: 38px; padding: 0; justify-content: center; }
    }
    @media (max-width: 480px) { .reiter svg { display: none; } .reiter button { padding: 0.55rem 0.2rem; font-size: 0.84rem; } }
  </style>
</head>

  <script>
    // Arbeitszeiten-Backend (Stunden + NE.W-Linien). Nur zum Prüfen der PIN; liest nur ("uebersicht"), schreibt nie.
    const AZ_URL = "https://script.google.com/macros/s/AKfycbzlUcw-sJFQLJouP44M_oC2Ko2ZKXv-DuR1VkHTZQKo-lUsB0Hk42fgJcP1v2NHolpd1Q/exec";
    const DEMO = /[?&]demo\b/.test(location.search) || !/^https?:$/.test(location.protocol) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

    // Unter diesen Schlüsseln merken sich die drei Seiten die PIN (nur für diese Browser-Sitzung)
    const PIN_SCHLUESSEL = ["az_dispo_pin", "fp_dispo_pin"];
    const ICON = {
      linien: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16"/><path d="M8 21l1.5-4M16 21l-1.5-4"/><circle cx="8.5" cy="14" r=".6" fill="currentColor"/><circle cx="15.5" cy="14" r=".6" fill="currentColor"/></svg>',
      fuhrpark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h11l3 5h2v5h-2"/><circle cx="7.5" cy="17.5" r="2"/><circle cx="16.5" cy="17.5" r="2"/><path d="M9.5 17.5h5M5 12h14"/></svg>',
      stunden: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      serien: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14.5l2.2 2.2L16 13"/></svg>',
    };
    const SEITEN = [
      { id: "linien", titel: "NE.W-Linien", pfad: "/new-linien/" },
      { id: "fuhrpark", titel: "Fuhrpark", pfad: "/interne-untersuchung/" },
      { id: "stunden", titel: "Stunden", pfad: "/dispo-stunden/" },
      { id: "serien", titel: "Serien", pfad: "/dispo/serien/" },   // eigenes Passwort, eigenes Backend
    ];

    const $ = (id) => document.getElementById(id);
    function sitzung(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
    function merke(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

    function pinPruefen(pin) {
      if (DEMO) return new Promise((ok) => setTimeout(() => ok({ status: "ok" }), 400));
      const d = new Date(), monat = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      return Promise.race([
        fetch(AZ_URL, { method: "POST", body: JSON.stringify({ aktion: "uebersicht", pin: pin, monat: monat }) }).then((r) => r.json()),
        new Promise((_, nein) => setTimeout(() => nein(new Error("Zeitüberschreitung")), 45000)),
      ]).catch(() => ({ status: "error", message: "Keine Verbindung. Bitte nochmal versuchen." }));
    }

    // ===== Reiter =====
    const rahmen = {};
    let aktiv = "";

    function reiterBauen() {
      $("reiter").innerHTML = SEITEN.map((s) => '<button type="button" role="tab" data-id="' + s.id + '">' + ICON[s.id] + "<span>" + s.titel + "</span></button>").join("");
      $("reiter").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.id; }));
    }

    // In den eingebetteten Seiten nur deren eigenes "Abmelden" ausblenden; abgemeldet wird oben für alle
    function einpassen(frame) {
      try {
        const d = frame.contentDocument;
        if (!d || !d.head || d.getElementById("portal-stil")) return;
        const st = d.createElement("style");
        st.id = "portal-stil";
        st.textContent = "#abmelden{display:none!important}";
        d.head.appendChild(st);
      } catch (e) { /* andere Adresse: nichts anfassen */ }
    }

    function rahmenFuer(s) {
      if (rahmen[s.id]) return rahmen[s.id];
      const box = document.createElement("div");
      box.hidden = true;
      const laden = document.createElement("div");
      laden.className = "laden";
      laden.innerHTML = '<div class="spinner"></div>';
      const f = document.createElement("iframe");
      f.title = s.titel;
      f.src = s.pfad + (DEMO && /[?&]demo\b/.test(location.search) ? "?demo" : "");
      f.addEventListener("load", () => { einpassen(f); laden.hidden = true; });
      box.append(f, laden);
      $("buehne").appendChild(box);
      rahmen[s.id] = { box, f, laden };
      return rahmen[s.id];
    }

    function zeige(id) {
      const s = SEITEN.find((x) => x.id === id) || SEITEN[0];
      aktiv = s.id;
      SEITEN.forEach((x) => { const r = rahmenFuer(x); r.box.hidden = x.id !== s.id; });
      $("reiter").querySelectorAll("button").forEach((b) => { const an = b.dataset.id === s.id; b.classList.toggle("an", an); b.setAttribute("aria-selected", an); });
      document.title = s.titel + " – Dispo Euskirchen";
      merke("dispo_portal_reiter", s.id);
    }

    function startReiter() { return (location.hash || "").slice(1) || merke("dispo_portal_reiter") || SEITEN[0].id; }

    function zeigeApp() {
      $("pin-seite").hidden = true;
      $("app").hidden = false;
      zeige(startReiter());   // legt alle Rahmen an, die anderen laden im Hintergrund schon mit
    }

    // ===== Anmelden / Abmelden =====
    $("pin-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const pin = $("pin").value.trim();
      if (!pin) return;
      $("pin-knopf").disabled = true;
      $("pin-fehler").textContent = "";
      const r = await pinPruefen(pin);
      $("pin-knopf").disabled = false;
      if (r && r.status === "ok") { PIN_SCHLUESSEL.forEach((k) => sitzung(k, pin)); $("pin").value = ""; zeigeApp(); }
      else { $("pin-fehler").textContent = (r && r.message) || "Fehler."; $("pin").select(); }
    });

    $("abmelden").addEventListener("click", () => {
      PIN_SCHLUESSEL.concat(["sp_passwort"]).forEach((k) => sitzung(k, null));   // sp_passwort = Serien-Passwort
      Object.keys(rahmen).forEach((k) => { rahmen[k].box.remove(); delete rahmen[k]; });
      $("app").hidden = true;
      $("pin-seite").hidden = false;
      $("pin").focus();
      document.title = "Dispo – Viamed Euskirchen";
    });

    $("neu").addEventListener("click", () => {
      const r = rahmen[aktiv];
      if (!r) return;
      r.laden.hidden = false;
      try { r.f.contentWindow.location.reload(); } catch (e) { r.f.src = r.f.src; }
    });

    window.addEventListener("hashchange", () => { if (!$("app").hidden) zeige(startReiter()); });

    // ===== Start =====
    reiterBauen();
    if (DEMO) {
      const d = document.createElement("div"); d.className = "demo"; d.textContent = "DEMO"; document.body.appendChild(d);
      $("pin-fehler").insertAdjacentHTML("afterend", '<p class="hinweis">Demo: PIN 1234</p>');
    }
    if (sitzung("az_dispo_pin")) zeigeApp();   // in diesem Tab schon angemeldet (z. B. nach Neuladen)
    else $("pin").focus();
  </script>
</body>
</html>
