  <style>
    /* Serienpatienten für die Dispo (Viamed Euskirchen). Eigenes Passwort, Daten nur vom eigenen Backend (Gesundheitsdaten: nie im Repo). Design wie NE.W-Linien. */
    :root { --tinte: #14231a; --text: #2c3a31; --leise: #6b7a70; --feld: #f4f7f5; --flaeche: #eef5f0; --linie: #e8efea;
            --gruen: #2e9a3e; --gruen-2: #7cc242; --gruen-hell: #e9f7e6; --blau: #0284c7; --blau-hell: #e6f5fd; --rose: #e11d48; --rose-hell: #ffeef2;
            --gelb: #b45309; --gelb-hell: #fff4dc; --orange: #ea580c; --orange-hell: #fff1e6; --lila: #7c3aed; --lila-hell: #f3edff; --schatten: 0 8px 28px rgba(20, 50, 30, 0.08); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: radial-gradient(1200px 500px at 50% -200px, #d9f0d9 0%, transparent 70%), var(--flaeche); min-height: 100vh; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 1rem 1.25rem; }
    button { font: inherit; }

    /* Passwort */
    .pin-seite { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    .pin-karte { width: 100%; max-width: 380px; background: #fff; border-radius: 28px; box-shadow: 0 24px 60px rgba(20,50,30,0.15); overflow: hidden; text-align: center; }
    .pin-kopf { color: #fff; padding: 1.6rem 1.4rem 2.6rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .pin-kopf .logo { margin: 0 auto 0.8rem; }
    .pin-kopf h1 { font-size: 1.4rem; font-weight: 800; }
    .pin-kopf p { font-size: 0.88rem; opacity: 0.92; margin-top: 0.2rem; }
    .schloss { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.8rem; background: rgba(255,255,255,0.18); border-radius: 999px; padding: 0.3rem 0.75rem; font-size: 0.78rem; font-weight: 700; }
    .pin-form { padding: 0 1.4rem 1.5rem; margin-top: -1.6rem; }
    .pin-form input { width: 100%; height: 60px; border-radius: 16px; border: 2px solid transparent; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,0.12); text-align: center; font-size: 1.25rem; letter-spacing: 0.12em; font-weight: 800; color: var(--tinte); }
    .pin-form input:focus { outline: none; border-color: var(--gruen); }
    .pin-form input::placeholder { letter-spacing: 0.04em; font-size: 1.05rem; font-weight: 600; color: #a3b1a8; }
    .knopf { width: 100%; height: 56px; margin-top: 0.9rem; border: none; border-radius: 16px; color: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; background: linear-gradient(135deg, var(--gruen), var(--gruen-2)); box-shadow: 0 10px 22px rgba(0,0,0,0.14); }
    .knopf.rot { background: linear-gradient(135deg, #e11d48, #fb7185); box-shadow: 0 10px 22px rgba(225,29,72,0.25); }
    .knopf.blau { background: linear-gradient(135deg, #0369a1, #38bdf8); box-shadow: 0 10px 22px rgba(2,132,199,0.25); }
    .knopf:disabled { opacity: 0.65; cursor: wait; }
    .fehler { margin-top: 0.8rem; color: var(--rose); font-size: 0.88rem; font-weight: 600; min-height: 1.2em; }
    .hinweis-klein { font-size: 0.8rem; color: var(--leise); margin-top: 0.2rem; }

    /* Kopf */
    .hero { position: relative; overflow: hidden; color: #fff; border-radius: 26px; padding: 1.2rem 1.3rem 1.3rem; background: linear-gradient(135deg, #0f6b4f 0%, #2e8b3a 45%, #6fb83a 100%); }
    .hero::before { content: ""; position: absolute; width: 300px; height: 300px; right: -90px; top: -150px; border-radius: 50%; background: rgba(255,255,255,0.1); pointer-events: none; }
    .kopf { position: relative; display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
    .logo { width: 50px; height: 50px; border-radius: 15px; background: #fff; display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,0.15); }
    .logo img { width: 36px; height: 36px; }
    .kopf h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; }
    .kopf p { font-size: 0.85rem; opacity: 0.9; }
    .rechts-oben { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .monat { display: flex; align-items: center; gap: 0.3rem; background: rgba(255,255,255,0.18); border-radius: 999px; padding: 0.25rem; }
    .monat button { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,0.22); color: #fff; font-size: 1.1rem; cursor: pointer; }
    .monat strong { min-width: 150px; text-align: center; font-size: 0.95rem; }

  <script>
    // Serienpatienten: Fahrplan, Ausfälle und Zusatzfahrten je Monat auswerten, Eingaben prüfen (Browser, Demo, Apps-Script-Backend und Node-Tests, kein DOM).
// Eine Fahrt = eine Richtung (Hin oder Rück), wie in der Abrechnung (je Richtung eine Position).
// Patient: { id, name, art, ziel, kostentraeger, abrechnung kasse|privat, rhythmus woche|nwochen|einzeln, tage [1,3,5], alleN, hin, rueck,
//            richtung beide|hin|rueck, ab, ende, genVon, genBis, genFahrten, telefon, notiz }
// Ereignis: { id, patient, art ausfall|fahrt|anruf, von, bis, richtung, grund, ersatzFuer, notiz, eingetragen, geloescht }
// Anruf = wöchentliche Qualitätskontrolle (Wie waren die Fahrten? Stehen Termine an?), grund = Ergebnis
const Serien = (function () {
  const WT_KURZ = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const WT_REIHE = [1, 2, 3, 4, 5, 6, 0];   // Anzeige Mo … So
  const ARTEN = ["Dialyse", "Chemotherapie", "Bestrahlung", "Podologie", "Tagesklinik"];   // Reihenfolge der Gruppen, Dialyse oben
  const GRUENDE = ["Krank", "Krankenhaus", "Abgesagt", "Fährt privat", "Termin verschoben", "Sonstiges"];
  const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  const RICHTUNG_TEXT = { beide: "Hin + Rück", hin: "nur Hin", rueck: "nur Rück" };
  const WARN_TAGE = 28;      // Genehmigung läuft ab: so viele Tage vorher gelb
  const WARN_FAHRTEN = 6;    // genehmigte Fahrten: ab diesem Rest gelb
  const ANRUF_TAGE = 7;      // jeden Serienpatienten einmal pro Woche anrufen
  const ANRUF_FAHRTEN = ["Alles gut", "Kritik"];
  const ANRUF_TERMINE = ["Keine neuen", "Neue Termine", "Änderung / Ausfall"];

  // ---------- Datum ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function datum(s) { return new Date(s + "T12:00:00"); }
  function istIso(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")) && iso(datum(s)) === s; }
  function plusTage(s, n) { const d = datum(s); d.setDate(d.getDate() + n); return iso(d); }
  function wochentag(s) { return datum(s).getDay(); }
  function tageZwischen(a, b) { return Math.round((datum(b) - datum(a)) / 86400000); }
  function montag(s) { return plusTage(s, -((wochentag(s) + 6) % 7)); }

      t.className = "toast" + (fehler ? " fehler" : ""); t.textContent = text;
      clearTimeout(toastUhr); toastUhr = setTimeout(() => t.remove(), fehler ? 6000 : 3200);
    }

    // ---------- Backend ----------
    function apiPost(body) {
      if (DEMO) return Demo.post(body);
      if (!API_URL) return Promise.resolve({ status: "error", message: "Das Serien-Backend ist noch nicht eingerichtet." });
      return Promise.race([fetch(API_URL, { method: "POST", body: JSON.stringify(body) }).then((r) => r.json()),
                           new Promise((_, nein) => setTimeout(() => nein(new Error("Zeitüberschreitung")), 45000))])
        .catch(() => ({ status: "error", message: "Keine Verbindung. Bitte nochmal versuchen." }));
    }

    // ---------- Zustand ----------
    let daten = null, erg = {}, monat = "", ansicht = "patienten", suche = "", gewaehlt = "", form = null, nurWarn = false, verlaufAlle = false;
    let letzteEingabe = Date.now(), geladenUm = 0;

    async function lade(still) {
      const pw = speicherS(PW_SCHLUESSEL);
      if (!pw) return sperren();
      if (!still) $("laden").hidden = false;
      const r = await apiPost({ aktion: "liste", passwort: pw });
      $("laden").hidden = true;
      return uebernehmen(r, still);
    }
    // Antwort vom Backend: ok = alle Daten neu; Passwort falsch/gesperrt = zurück zur Abfrage
    function uebernehmen(r, still) {
      if (r && r.status === "ok") {
        daten = r; geladenUm = Date.now();
        if (!monat) monat = daten.heute.slice(0, 7);
        if (r.id && daten.patienten.some((p) => p.id === r.id)) gewaehlt = r.id;
        if (!daten.patienten.some((p) => p.id === gewaehlt)) gewaehlt = "";
        const y = window.scrollY;
        zeichne();
        if (still) window.scrollTo(0, y);
      } else if (r && (r.status === "passwort" || r.status === "gesperrt")) sperren(r.message);
      else if (!still) toast((r && r.message) || "Keine Verbindung.", true);
      return r;
    }

    function auswerten() {
      erg = {};
      daten.patienten.forEach((p) => { erg[p.id] = { m: S.monat(p, daten.ereignisse, monat, daten.heute), g: S.genehmigung(p, daten.ereignisse, daten.heute), a: S.anrufStatus(p, daten.ereignisse, daten.heute), aktiv: S.aktivImMonat(p, monat) }; });
    }

    // ---------- Anzeige ----------
    function zeichne() {
      formMerken();
      auswerten();
      const dieser = daten.heute.slice(0, 7);
      $("monat-text").innerHTML = esc(S.monatName(monat)) + "<small>" + (monat === dieser ? "dieser Monat" : monat < dieser ? "vergangen" : "geplant") + "</small>";
      $("dieser").hidden = monat === dieser;
      const aktive = daten.patienten.filter((p) => erg[p.id].aktiv);
      const sum = aktive.reduce((s, p) => { const m = erg[p.id].m; s.f += m.fahrten; s.a += m.ausgefallen; s.o += m.offen; return s; }, { f: 0, a: 0, o: 0 });
      const warn = daten.patienten.filter(istWarn).length;
      const anrufe = daten.patienten.filter((p) => erg[p.id].a.faellig).length;
      const arten = S.gruppen(aktive).length;
      const mName = S.monatName(monat).split(" ")[0];
      $("kacheln").innerHTML =
        '<button type="button" class="kachel' + (ansicht === "anrufe" ? " an" : "") + '" id="k-anruf"><small>Anrufe fällig</small><strong>' + anrufe + "</strong> <span>" + (anrufe ? "Wochenanruf offen" : "alle erledigt") + "</span></button>" +
        '<div class="kachel"><small>Patienten</small><strong>' + aktive.length + "</strong> <span>in " + mz(arten, "Serienart", "Serienarten") + "</span></div>" +
        '<div class="kachel"><small>Fahrten ' + esc(mName) + "</small><strong>" + sum.f + "</strong> <span>" + (sum.o ? "davon " + sum.o + " noch geplant" : "Hin und Rück einzeln") + "</span></div>" +
        '<button type="button" class="kachel' + (ansicht === "ausfaelle" ? " an" : "") + '" id="k-ausfall"><small>Ausfälle ' + esc(mName) + "</small><strong>" + sum.a + "</strong> <span>Fahrten ausgefallen</span></button>" +
        '<button type="button" class="kachel' + (nurWarn ? " an" : "") + '" id="k-warn"><small>Genehmigung</small><strong>' + warn + "</strong> <span>" + (warn ? "zu prüfen" : "alles in Ordnung") + "</span></button>";
      $("k-ausfall").addEventListener("click", () => wechsleAnsicht(ansicht === "ausfaelle" ? "patienten" : "ausfaelle"));
      $("k-anruf").addEventListener("click", () => wechsleAnsicht(ansicht === "anrufe" ? "patienten" : "anrufe"));
      $("z-anrufe").textContent = anrufe; $("z-anrufe").classList.toggle("null", !anrufe);
      $("k-warn").addEventListener("click", () => { nurWarn = !nurWarn; if (nurWarn) ansicht = "patienten"; zeichne(); });
      $("z-ausfaelle").textContent = sum.a; $("z-ausfaelle").classList.toggle("null", !sum.a);
      $("reiter").querySelectorAll("button").forEach((b) => b.classList.toggle("an", b.dataset.ansicht === ansicht));
      $("arten").innerHTML = S.ARTEN.concat(daten.patienten.map((p) => p.art)).filter((a, i, l) => a && l.indexOf(a) === i).map((a) => '<option value="' + esc(a) + '"></option>').join("");
      if (!gewaehlt && !(form && form.typ === "patient" && form.op === "neu")) { const g = S.gruppen(aktive)[0]; gewaehlt = g ? g.patienten[0].id : ""; }
      links(); rechts();
      $("stand").textContent = (DEMO ? "DEMO – erfundene Daten · " : "") + "Stand " + new Date(daten.stand).toLocaleString("de-DE") +
        " · " + mz(daten.patienten.length, "Patient", "Patienten") + " insgesamt · sperrt nach " + SPERRE_MIN + " Min. ohne Eingabe";
    }

    function wechsleAnsicht(a) { ansicht = a; if (a === "ausfaelle") nurWarn = false; zeichne(); }

    function zeileHtml(p) {
      const e = erg[p.id], m = e.m, g = e.g, an = p.id === gewaehlt && !(form && form.op === "neu");
      const pills = ['<span class="pill">' + esc(S.planText(p)) + "</span>"];
      if (p.ziel) pills.push('<span class="pill">' + esc(p.ziel) + "</span>");
      if (p.abrechnung === "privat") pills.push('<span class="pill l">privat</span>');
      if (e.aktiv && (g.stufe === "rot" || g.stufe === "gelb")) pills.push('<span class="pill ' + (g.stufe === "rot" ? "k" : "w") + '">' + esc(warnKurz(g)) + "</span>");
      if (e.aktiv && m.ohneGen) pills.push('<span class="pill k">' + mz(m.ohneGen, "Fahrt", "Fahrten") + " ohne Genehmigung</span>");
      if (e.a.faellig) pills.push('<span class="pill u">Anruf fällig</span>');
      const rechts = e.aktiv
        ? '<div class="std">' + m.fahrten + "<small>Fahrten</small>" + (m.ausgefallen ? '<small class="rot">' + m.ausgefallen + " ausgefallen</small>" : "") + "</div>"
        : '<div class="std leise"><small>' + (p.ende && p.ende < S.monatsErster(monat) ? "beendet " + S.de(p.ende) : "ab " + S.de(p.ab)) + "</small></div>";
      return '<div class="zeile' + (an ? " an" : "") + (e.aktiv ? "" : " inaktiv") + '" data-id="' + esc(p.id) + '">' +
        '<div class="ava" style="background:' + artFarbe(p.art) + '">' + esc(initialen(p.name)) + "</div>" +
        '<div><div class="name">' + esc(p.name) + '</div><div class="meta">' + pills.join("") + "</div></div>" + rechts + "</div>";
    }

    function links() {
      let h = "";
      if (ansicht === "ausfaelle") h = linksAusfaelle();
      else if (ansicht === "anrufe") h = linksAnrufe();
      else {
        const passt = (p) => (!suche || passtSuche(p.name + " " + p.ziel + " " + p.art + " " + p.kostentraeger + " " + (p.telefon || ""), suche)) && (!nurWarn || istWarn(p));
        const aktive = daten.patienten.filter((p) => erg[p.id].aktiv && passt(p));
        const andere = daten.patienten.filter((p) => !erg[p.id].aktiv && passt(p)).sort((a, b) => a.name.localeCompare(b.name, "de"));
        if (nurWarn) h += '<div class="filter">Nur Patienten mit Hinweis zur Genehmigung<button type="button" id="filter-aus">✕ Filter aus</button></div>';
        S.gruppen(aktive).forEach((g) => {
          const f = g.patienten.reduce((s, p) => s + erg[p.id].m.fahrten, 0);
          h += '<h2 class="gruppe"><span class="punkt" style="background:' + artFarbe(g.art) + '"></span>' + esc(g.art) + "<small>" + mz(g.patienten.length, "Patient", "Patienten") + " · " + mz(f, "Fahrt", "Fahrten") + "</small></h2>" + g.patienten.map(zeileHtml).join("");
        });
        if (!aktive.length) h += '<p class="leer">' + (suche || nurWarn ? "Kein Treffer im " + esc(S.monatName(monat)) + "." : daten.patienten.length ? "Im " + esc(S.monatName(monat)) + " läuft keine Serie." : "Noch keine Serienpatienten. Oben „+ Patient anlegen“.") + "</p>";
        if (andere.length) h += '<details class="weg-liste"' + (suche ? " open" : "") + '><summary class="abschnitt">Nicht aktiv im ' + esc(S.monatName(monat)) + " <small>" + andere.length + "</small></summary>" + andere.map(zeileHtml).join("") + "</details>";
      }
      $("links").innerHTML = h;
      $("links").querySelectorAll(".zeile[data-id]").forEach((z) => z.addEventListener("click", (ev) => {
        if (ev.target.closest("a.tel")) return;   // Telefonnummer anklicken = anrufen, nicht auswählen
        waehle(z.dataset.id);
        if (z.dataset.anruf) oeffneForm("anruf", daten.patienten.find((p) => p.id === z.dataset.id));
      }));
      if ($("filter-aus")) $("filter-aus").addEventListener("click", () => { nurWarn = false; zeichne(); });
    }

    function telLink(p, cls) { return p.telefon ? '<a class="tel' + (cls ? " " + cls : "") + '" href="tel:' + esc(p.telefon.replace(/[^\d+]/g, "")) + '">' + esc(p.telefon) + "</a>" : ""; }
    function anrufText(a) {
      if (!a.aktiv) return "";
      if (!a.faellig) return "nächster Anruf " + S.tagKurz(a.faelligAm);
      if (!a.letzter) return "noch nie angerufen";
      return a.seit === 0 ? "heute fällig" : "fällig seit " + mz(a.seit, "Tag", "Tagen");
    }
    function linksAnrufe() {
      const liste = daten.patienten.filter((p) => erg[p.id].a.aktiv && (!suche || passtSuche(p.name + " " + p.art + " " + (p.telefon || ""), suche)));
      const faellig = liste.filter((p) => erg[p.id].a.faellig).sort((x, y) => erg[y.id].a.seit - erg[x.id].a.seit || (erg[x.id].a.letzter ? 1 : 0) - (erg[y.id].a.letzter ? 1 : 0) || x.name.localeCompare(y.name, "de"));
      const erledigt = liste.filter((p) => !erg[p.id].a.faellig).sort((x, y) => erg[x.id].a.faelligAm.localeCompare(erg[y.id].a.faelligAm) || x.name.localeCompare(y.name, "de"));
      const zeile = (p) => {
        const a = erg[p.id].a, pills = ['<span class="pill">' + esc(p.art) + "</span>", '<span class="pill ' + (a.faellig ? "u" : "g") + '">' + esc(anrufText(a)) + "</span>"];
        if (a.versuch) pills.push('<span class="pill w">nicht erreicht ' + esc(S.kurz(a.versuch.von)) + "</span>");
        if (a.letzter && /Kritik/.test(a.letzter.grund)) pills.push('<span class="pill k">Kritik ' + esc(S.kurz(a.letzter.von)) + "</span>");
        return '<div class="zeile' + (p.id === gewaehlt ? " an" : "") + '" data-id="' + esc(p.id) + '"' + (a.faellig ? ' data-anruf="1"' : "") + '><div class="ava" style="background:' + artFarbe(p.art) + '">' + esc(initialen(p.name)) + "</div>" +
          '<div><div class="name">' + esc(p.name) + '</div><div class="meta">' + pills.join("") + "</div></div>" + (telLink(p) || '<span class="pill">Telefon fehlt</span>') + "</div>";
      };
      let h = "<h2>Wochenanruf<small>Qualitätskontrolle · jede Woche</small></h2>" +
        '<p class="leitfaden">Jeden Serienpatienten einmal pro Woche anrufen: Wie waren die Fahrten? Stehen neue Termine an? Neue Termine sofort eintragen, sonst gehen Fahrten verloren.</p>';
      h += '<div class="abschnitt">Fällig<small>' + faellig.length + "</small></div>" + (faellig.length ? faellig.map(zeile).join("") : '<p class="leer">Alle Wochenanrufe erledigt.</p>');
      if (erledigt.length) h += '<div class="abschnitt">Diese Woche erledigt<small>' + erledigt.length + "</small></div>" + erledigt.map(zeile).join("");
      return h;
    }

    function linksAusfaelle() {
      const liste = S.ausfaelleImMonat(daten.patienten.filter((p) => !suche || passtSuche(p.name + " " + p.art, suche)), daten.ereignisse, monat);
      const summe = liste.reduce((s, a) => s + a.fahrten, 0);
      let h = '<h2>Ausfälle im ' + esc(S.monatName(monat)) + "<small>" + mz(summe, "Fahrt", "Fahrten") + " · " + mz(new Set(liste.map((a) => a.patient.id)).size, "Patient", "Patienten") + "</small></h2>";
      if (!liste.length) return h + '<p class="leer">Keine Ausfälle in diesem Monat.</p>';
      let tag = "";
      liste.forEach((a) => {
        if (a.datum !== tag) { tag = a.datum; h += '<div class="abschnitt">' + esc(S.WT_KURZ[S.wochentag(tag)] + ", " + S.de(tag)) + (a.feiertag ? ' <span class="pill w ft-pill">' + esc(a.feiertag) + "</span>" : "") + "</div>"; }
        h += '<div class="zeile' + (a.patient.id === gewaehlt ? " an" : "") + '" data-id="' + esc(a.patient.id) + '"><div class="ava" style="background:' + artFarbe(a.patient.art) + '">' + esc(initialen(a.patient.name)) + "</div>" +
          '<div><div class="name">' + esc(a.patient.name) + '</div><div class="meta"><span class="pill">' + esc(a.patient.art) + '</span><span class="pill k">' + esc(a.grund || "Ausfall") + "</span></div></div>" +
          '<div class="std">' + a.fahrten + "<small>" + esc(richtungText(a.richtung)) + "</small></div></div>";
      });
      return h;
    }

    function waehle(id) {
      if (form && form.typ === "patient" && form.op === "neu") form = null;
      if (form && form.id !== id) form = null;
      gewaehlt = id; verlaufAlle = false;
      links(); rechts();
      if (window.matchMedia("(max-width: 900px)").matches) $("rechts").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ---------- Rechte Seite ----------
    function rechts() {
      if (form && form.typ === "patient" && form.op === "neu") { $("rechts").innerHTML = '<div class="karte">' + formPatientHtml(null) + "</div>"; return formBinden(null); }
      const p = daten.patienten.find((x) => x.id === gewaehlt);
      if (!p) { $("rechts").innerHTML = '<div class="karte"><p class="leer">Links einen Patienten wählen.</p></div>'; return; }
      const e = erg[p.id], m = e.m, g = e.g, mName = S.monatName(monat);
      const einzeln = p.rhythmus === "einzeln";
      let h = '<div class="karte">';
      h += '<div class="detail-kopf"><div class="ava xl" style="background:' + artFarbe(p.art) + '">' + esc(initialen(p.name)) + "</div>" +
        "<div><strong>" + esc(p.name) + '</strong><div class="unter">' + esc([p.art, p.ziel, (p.abrechnung === "privat" ? "privat" : "Kasse") + (p.kostentraeger ? ": " + p.kostentraeger : "")].filter(Boolean).join(" · ")) + "</div></div>" +
        '<div class="gross">' + m.fahrten + "<small>Fahrten " + esc(mName) + "</small></div></div>";
      const a = e.a;
      if (a.aktiv) {
        const zuletzt = [a.letzter ? "zuletzt erreicht " + S.tagKurz(a.letzter.von) + ": " + a.letzter.grund.replace(/^Erreicht · /, "") : "", a.versuch ? "nicht erreicht " + S.tagKurz(a.versuch.von) : ""].filter(Boolean).join(" · ");
        h += '<div class="anruf-band' + (a.faellig ? " faellig" : "") + '"><div><b>' + esc(a.faellig ? "Wochenanruf " + anrufText(a) : "Wochenanruf erledigt · nächster am " + S.tagKurz(a.faelligAm)) + "</b>" +
          (zuletzt ? "<span>" + esc(zuletzt) + "</span>" : "") + "</div>" + (telLink(p) || '<span class="tel leer">Telefon fehlt</span>') +
          '<button type="button" class="aktion blau' + (form && form.typ === "anruf" ? " an" : "") + '" data-form="anruf">✓ Anruf eintragen</button></div>';
      }
      h += '<div class="aktionen">' +
        '<button type="button" class="aktion rot' + (form && form.typ === "ausfall" ? " an" : "") + '" data-form="ausfall">✕ Ausfall eintragen</button>' +
        '<button type="button" class="aktion gruen' + (form && form.typ === "fahrt" ? " an" : "") + '" data-form="fahrt">+ ' + (einzeln ? "Termin" : "Zusatzfahrt") + "</button>" +
        '<button type="button" class="aktion' + (form && form.typ === "patient" ? " an" : "") + '" data-form="patient">Bearbeiten</button></div>';
      if (form && form.id === p.id) h += form.typ === "ausfall" ? formAusfallHtml(p) : form.typ === "fahrt" ? formFahrtHtml(p) : form.typ === "anruf" ? formAnrufHtml(p) : formPatientHtml(p);

      // Fahrtdaten des Monats
      const teile = [mz(m.fahrtTage, "Tag", "Tage"), mz(m.fahrten, "Fahrt", "Fahrten")];
      if (m.ausgefallen) teile.push(m.ausgefallen + " ausgefallen");
      if (m.zusatz) teile.push(m.zusatz + " zusätzlich");
      if (m.feiertage) teile.push(mz(m.feiertage, "Feiertag", "Feiertage"));
      h += '<div class="abschnitt">Fahrtdaten ' + esc(mName) + "<small>" + esc(teile.join(" · ")) + "</small></div>";
      h += kalenderHtml(p, m);
      h += '<div class="legende"><span><i>H</i><i>R</i> Hin / Rück</span><span><i class="zusatz">+H</i> zusätzlich</span><span><i class="ausfall">H</i> ausgefallen</span><span><i class="ft">F</i> Feiertag</span><span>Tag anklicken = eintragen</span></div>';
      const text = S.fahrtdatenText(m.tage);
      h += '<div class="kopie"><div><small>Fahrtage für die Rechnung (' + mz(m.fahrten, "Fahrt", "Fahrten") + ")</small>" + (text ? esc(text) : "keine") + "</div>" + (text ? '<button type="button" id="kopieren">Kopieren</button>' : "") + "</div>";

      // Genehmigung
      h += '<div class="abschnitt">Genehmigung &amp; Abrechnung</div>';
      h += '<div class="gen-status ' + (g.stufe === "ok" ? "" : g.stufe || "leer") + '">' + esc(g.text) + "</div>";
      if (m.ohneGen) h += '<div class="gen-status rot">' + esc(mName) + ": " + mz(m.ohneGen, "Fahrt", "Fahrten") + " außerhalb der Genehmigung</div>";
      h += '<div class="info"><span>Abrechnung</span><b>' + (p.abrechnung === "privat" ? "Privat (DATEV)" : "Kasse (DMRZ)") + "</b></div>";
      h += '<div class="info"><span>Kostenträger</span><b>' + esc(p.kostentraeger || "–") + "</b></div>";
      if (g.von || g.bis) h += '<div class="info"><span>Gültig</span><b>' + esc((g.von ? S.de(g.von) : "…") + " – " + (g.bis ? S.de(g.bis) : "offen")) + "</b></div>";
      if (g.fahrten) {
        const anteil = Math.max(0, Math.min(100, Math.round(g.gefahren / g.fahrten * 100)));
        h += '<div class="info"><span>Genehmigte Fahrten</span><b>' + g.fahrten + " genehmigt · " + g.gefahren + " gefahren · Rest " + g.rest +
          '<span class="balken ' + (g.stufe === "ok" ? "" : g.stufe) + '"><span style="width:' + anteil + '%"></span></span></b></div>';
      }

      // Verlauf
      const eig = daten.ereignisse.filter((x) => x.patient === p.id).sort((a, b) => b.von.localeCompare(a.von) || String(b.eingetragen).localeCompare(String(a.eingetragen)));
      const anzahl = (art) => eig.filter((x) => x.art === art).length;
      h += '<div class="abschnitt">Verlauf<small>' + mz(anzahl("ausfall"), "Ausfall", "Ausfälle") + " · " + mz(anzahl("fahrt"), einzeln ? "Termin" : "Zusatzfahrt", einzeln ? "Termine" : "Zusatzfahrten") + " · " + mz(anzahl("anruf"), "Anruf", "Anrufe") + "</small></div>";
      if (!eig.length) h += '<p class="leer" style="padding:1rem">Noch keine Ausfälle, Zusatzfahrten oder Anrufe.</p>';
      (verlaufAlle ? eig : eig.slice(0, 8)).forEach((x) => { h += eintragHtml(p, x, einzeln); });
      if (!verlaufAlle && eig.length > 8) h += '<button type="button" class="mehr" id="verlauf-mehr">Alle ' + eig.length + " Einträge anzeigen</button>";

      // Fahrplan
      h += '<div class="abschnitt">Fahrplan</div>';
      h += '<div class="info"><span>Rhythmus</span><b>' + esc(p.rhythmus === "woche" ? "Wöchentlich · " + S.tageText(p.tage) : p.rhythmus === "nwochen" ? "Alle " + p.alleN + " Wochen · " + S.tageText(p.tage) : "Einzelne Termine (werden einzeln eingetragen)") + "</b></div>";
      if (p.hin || p.rueck) h += '<div class="info"><span>Uhrzeit</span><b>' + esc([p.hin ? "Hin " + p.hin : "", p.rueck ? "Rück " + p.rueck : ""].filter(Boolean).join(" · ")) + "</b></div>";
      h += '<div class="info"><span>Fahrten je Termin</span><b>' + esc(richtungText(p.richtung)) + "</b></div>";
      if (p.telefon) h += '<div class="info"><span>Telefon</span><b>' + esc(p.telefon) + "</b></div>";
      h += '<div class="info"><span>Serie</span><b>' + esc("ab " + S.de(p.ab) + (p.ende ? " · endet am " + S.de(p.ende) : " · ohne Enddatum")) + "</b></div>";
      if (p.notiz) h += '<div class="info"><span>Notiz</span><b>' + esc(p.notiz) + "</b></div>";
      h += '<div class="info"><span>Angelegt</span><b>' + esc(p.angelegt + (p.geaendert ? " · geändert " + p.geaendert : "")) + "</b></div>";
      h += "</div>";
      $("rechts").innerHTML = h;

      $("rechts").querySelectorAll("[data-form]").forEach((b) => b.addEventListener("click", () => oeffneForm(b.dataset.form, p)));
      $("rechts").querySelectorAll(".kal-tag").forEach((b) => b.addEventListener("click", () => {
        const t = m.tage.find((x) => x.datum === b.dataset.datum);
        oeffneForm(t && (faehrt(t.hin) || faehrt(t.rueck)) ? "ausfall" : "fahrt", p, { von: b.dataset.datum, bis: b.dataset.datum });
      }));
      if ($("kopieren")) $("kopieren").addEventListener("click", () => kopiere(text));
      if ($("verlauf-mehr")) $("verlauf-mehr").addEventListener("click", () => { verlaufAlle = true; rechts(); });
      $("rechts").querySelectorAll("[data-loeschen]").forEach((b) => b.addEventListener("click", () => loeschen(b)));
      if (form && form.id === p.id) formBinden(p);
    }

    function kalenderHtml(p, m) {
      const tage = {}; m.tage.forEach((t) => { tage[t.datum] = t; });
      const erster = S.monatsErster(monat), letzter = S.monatsLetzter(monat);
      let h = '<div class="kal">' + ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map((w) => '<div class="kal-wt">' + w + "</div>").join("");
      for (let i = 0; i < (S.wochentag(erster) + 6) % 7; i++) h += "<div></div>";
      for (let s = erster; s <= letzter; s = S.plusTage(s, 1)) {
        const t = tage[s], ft = S.feiertag(s);
        const cls = ["kal-tag"];
        if (!t) cls.push("frei");
        if (ft) cls.push("ft");
        if (s > daten.heute) cls.push("zukunft");
        if (s === daten.heute) cls.push("heute");
        if (t && t.ohneGen && (faehrt(t.hin) || faehrt(t.rueck))) cls.push("ohnegen");
        const titel = [S.WT_KURZ[S.wochentag(s)] + " " + S.de(s)];
        let marken = "";
        if (t) ["hin", "rueck"].forEach((r) => {
          if (!t[r]) return;
          const wort = r === "hin" ? "Hin" : "Rück";
          marken += '<i class="' + t[r] + '">' + (t[r] === "zusatz" ? "+" : "") + (r === "hin" ? "H" : "R") + "</i>";
          titel.push(wort + ": " + (t[r] === "ausfall" ? "fällt aus (" + (t.grund[r] || "Ausfall") + ")" : t[r] === "zusatz" ? "zusätzlich" : "geplant"));
        });
        if (ft) titel.push("Feiertag: " + ft);
        if (t && t.ohneGen) titel.push("außerhalb der Genehmigung");
        h += '<button type="button" class="' + cls.join(" ") + '" data-datum="' + s + '" title="' + esc(titel.join(" · ")) + '"><span class="kal-z">' + Number(s.slice(8)) + '</span><span class="kal-hr">' + marken + "</span>" + (ft ? '<span class="kal-ft">Feiertag</span>' : "") + "</button>";
      }
      return h + "</div>";
    }

    function eintragHtml(p, x, einzeln) {
      const w = S.wirkung(p, daten.ereignisse, x);
      const zeit = S.tagKurz(x.von) + (x.bis && x.bis !== x.von ? " – " + S.tagKurz(x.bis) : "") + x.von.slice(0, 4);
      let titel, klein, farbe, zeichen;
      if (x.art === "anruf") {
        const ok = S.erreicht(x);
        farbe = ok ? "var(--blau)" : "#94a3b8"; zeichen = ok ? "✓" : "–"; titel = "Anruf · " + zeit; klein = esc(x.grund);
      } else if (x.art === "ausfall") {
        farbe = "var(--rose)"; zeichen = "✕"; titel = "Ausfall · " + zeit;
        klein = esc(richtungText(x.richtung) + " · " + x.grund) + " · " + (w.ausfall ? mz(w.ausfall, "Fahrt fällt", "Fahrten fallen") + " aus" : '<span class="warn">keine geplante Fahrt betroffen</span>');
      } else {
        farbe = "var(--gruen)"; zeichen = "+"; titel = (einzeln ? "Termin · " : x.ersatzFuer ? "Verlegt · " : "Zusatzfahrt · ") + zeit;
        klein = esc(richtungText(x.richtung)) + " · " + (w.fahrten ? mz(w.fahrten, "Fahrt", "Fahrten") + (einzeln ? "" : " zusätzlich") : '<span class="warn">Fahrt war schon geplant</span>') +
          (x.ersatzFuer ? esc(" · ersetzt " + S.tagKurz(x.ersatzFuer)) : "");
      }
      return '<div class="eintrag"><div class="i" style="background:' + farbe + '">' + zeichen + "</div>" +
        "<div><b>" + esc(titel) + '</b><span class="klein">' + klein + "</span>" + (x.notiz ? '<span class="notiz">' + esc(x.notiz) + "</span>" : "") +
        '<span class="quelle">eingetragen ' + esc(x.eingetragen) + "</span></div>" +
        '<button type="button" class="tag-aktion rot" data-loeschen="' + esc(x.id) + '">Löschen</button></div>';
    }

    async function kopiere(text) {
      try { await navigator.clipboard.writeText(text); }
      catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (e2) {} t.remove(); }
      toast("Fahrtage kopiert.");
    }

    // Löschen mit zweitem Klick zur Sicherheit
    async function loeschen(b) {
      if (!b.classList.contains("sicher")) {
        b.classList.add("sicher"); b.textContent = "Wirklich löschen?";
        setTimeout(() => { if (b.isConnected) { b.classList.remove("sicher"); b.textContent = "Löschen"; } }, 4000);
        return;
      }
      b.disabled = true;
      await schreibe({ aktion: "ereignis", op: "loeschen", id: b.dataset.loeschen });
    }

    // ---------- Formulare ----------
    function oeffneForm(typ, p, werte) {
      if (form && form.typ === typ && form.id === (p && p.id) && !werte) form = null;   // zweiter Klick schließt
      else {
        const heute = daten.heute, imMonat = heute.slice(0, 7) === monat ? heute : S.monatsErster(monat);
        form = { typ: typ, id: p ? p.id : "", op: p ? "aendern" : "neu",
                 werte: Object.assign(typ === "ausfall" ? { umfang: "tag", von: imMonat, bis: imMonat, richtung: "beide", grund: "", notiz: "" }
                                    : typ === "anruf" ? { erreicht: "ja", fahrten: "", termine: "", von: heute, notiz: "" }
                                    : typ === "fahrt" ? { von: imMonat, richtung: p && p.richtung || "beide", ersatzFuer: "", notiz: "" }
                                    : p ? JSON.parse(JSON.stringify(p)) : { rhythmus: "woche", tage: [], richtung: "beide", abrechnung: "kasse", ab: heute }, werte || {}) };
        if (werte && werte.von && werte.bis && werte.von !== werte.bis) form.werte.umfang = "zeitraum";
      }
      links(); rechts();
      const f = $("form");
      if (f) { f.scrollIntoView({ behavior: "smooth", block: "nearest" }); const erstes = f.querySelector("input:not([type=hidden])"); if (erstes && typ === "patient" && !p) erstes.focus(); }
    }

    // Eingaben vor dem Neuzeichnen merken (Monatswechsel, automatisches Neuladen)
    function formMerken() { if (form && $("form")) form.werte = formLesen(); }
    function wert(id) { const el = $(id); return el ? el.value.trim() : ""; }
    function formLesen() {
      const w = Object.assign({}, form.werte);
      const f = $("form");
      f.querySelectorAll("[data-feld]").forEach((el) => {
        if (el.classList.contains("segment") || el.classList.contains("chips")) { const an = el.querySelector("button.an"); w[el.dataset.feld] = an ? an.dataset.v : ""; }
        else if (el.classList.contains("wt")) w.tage = Array.from(el.querySelectorAll("button.an")).map((b) => Number(b.dataset.v));
        else w[el.dataset.feld] = el.value.trim();
      });
      return w;
    }
    function feld(label, name, w, typ, extra) {
      return "<label" + (extra && extra.cls ? ' class="' + extra.cls + '"' : "") + (extra && extra.id ? ' id="' + extra.id + '"' : "") + ">" + label +
        (extra && extra.opt ? ' <span class="opt">(' + extra.opt + ")</span>" : "") +
        (typ === "textarea" ? '<textarea data-feld="' + name + '" maxlength="500">' + esc(w[name]) + "</textarea>"
          : '<input data-feld="' + name + '" type="' + (typ || "text") + '" value="' + esc(w[name] == null ? "" : w[name]) + '"' + (extra && extra.attr ? " " + extra.attr : "") + " />") + "</label>";
    }
    function auswahl(label, name, w, optionen) {
      return "<label>" + label + '<select data-feld="' + name + '">' + optionen.map((o) => '<option value="' + o[0] + '"' + (w[name] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select></label>";
    }
    function segment(name, w, optionen) {
      return '<div class="segment" data-feld="' + name + '">' + optionen.map((o) => '<button type="button" data-v="' + o[0] + '"' + (w[name] === o[0] ? ' class="an"' : "") + ">" + esc(o[1]) + "</button>").join("") + "</div>";
    }
    function chips(name, w, liste) {
      return '<div class="chips" data-feld="' + name + '">' + liste.map((g) => '<button type="button" data-v="' + esc(g) + '"' + (w[name] === g ? ' class="an"' : "") + ">" + esc(g) + "</button>").join("") + "</div>";
    }
    const RICHTUNGEN = [["beide", "Hin + Rück"], ["hin", "nur Hinfahrt"], ["rueck", "nur Rückfahrt"]];

    function formAnrufHtml(p) {
      const w = form.werte, nein = w.erreicht === "nein";
      return '<div class="korr blau" id="form"><div class="korr-kopf"><b>Wochenanruf</b> · ' + esc(p.name) + (p.telefon ? " · " + telLink(p, "im-kopf") : "") + "</div>" +
        segment("erreicht", w, [["ja", "Erreicht"], ["nein", "Nicht erreicht"]]) +
        (nein ? "" : '<span class="label">Wie waren die Fahrten?</span>' + chips("fahrten", w, S.ANRUF_FAHRTEN) +
                     '<span class="label">Stehen neue Termine an? (auch Urlaub, Krankenhaus, geänderte Zeiten)</span>' + chips("termine", w, S.ANRUF_TERMINE)) +
        '<div class="korr-zeile">' + feld("Datum", "von", w, "date") + feld("Notiz", "notiz", w, "text", { cls: "breit2", opt: nein ? "z. B. Mailbox, Angehörige" : "z. B. was nicht gut war, welche Termine", attr: 'maxlength="300"' }) + "</div>" +
        '<div class="korr-vorschau" id="f-vorschau"></div>' +
        '<button type="button" class="knopf blau" id="f-speichern">Anruf speichern</button><button type="button" class="neben-link" id="f-abbrechen">Abbrechen</button></div>';
    }

    function formAusfallHtml(p) {
      const w = form.werte;
      return '<div class="korr rot" id="form"><div class="korr-kopf"><b>Ausfall eintragen</b> · ' + esc(p.name) + "</div>" +
        segment("umfang", w, [["tag", "Einzelner Tag"], ["zeitraum", "Zeitraum von – bis"]]) +
        '<div class="korr-zeile">' + feld(w.umfang === "zeitraum" ? "Von" : "Datum", "von", w, "date") + (w.umfang === "zeitraum" ? feld("Bis", "bis", w, "date") : "") +
        auswahl("Welche Fahrten", "richtung", w, RICHTUNGEN) + "</div>" +
        '<span class="label">Grund</span>' + chips("grund", w, S.GRUENDE) +
        '<div class="korr-zeile">' + feld("Notiz", "notiz", w, "text", { cls: "breit", opt: "optional, keine Diagnosen", attr: 'maxlength="300"' }) + "</div>" +
        '<div class="korr-vorschau" id="f-vorschau"></div>' +
        '<button type="button" class="knopf rot" id="f-speichern">Ausfall speichern</button><button type="button" class="neben-link" id="f-abbrechen">Abbrechen</button></div>';
    }

    function formFahrtHtml(p) {
      const w = form.werte, einzeln = p.rhythmus === "einzeln";
      return '<div class="korr" id="form"><div class="korr-kopf"><b>' + (einzeln ? "Termin eintragen" : "Zusatz- oder Ersatzfahrt") + "</b> · " + esc(p.name) + "</div>" +
        '<div class="korr-zeile">' + feld("Datum", "von", w, "date") + auswahl("Welche Fahrten", "richtung", w, RICHTUNGEN) +
        (einzeln ? "" : feld("Ersetzt die Fahrt am", "ersatzFuer", w, "date", { opt: "bei Verlegung" })) + "</div>" +
        '<div class="korr-zeile">' + feld("Notiz", "notiz", w, "text", { cls: "breit", opt: "optional, z. B. wegen Feiertag vorgezogen", attr: 'maxlength="300"' }) + "</div>" +
        '<div class="korr-vorschau" id="f-vorschau"></div>' +
        '<button type="button" class="knopf" id="f-speichern">' + (einzeln ? "Termin speichern" : "Fahrt speichern") + '</button><button type="button" class="neben-link" id="f-abbrechen">Abbrechen</button></div>';
    }

    function formPatientHtml(p) {
      const w = form.werte;
      const tage = S.tageListe(w.tage);
      return '<div class="korr' + (p ? "" : " allein") + '" id="form"><div class="korr-kopf"><b>' + (p ? "Bearbeiten" : "Neuer Serienpatient") + "</b>" + (p ? " · " + esc(p.name) : "") + "</div>" +
        '<div class="korr-zeile">' + feld("Name", "name", w, "text", { cls: "breit2", attr: 'placeholder="Nachname, Vorname" maxlength="80" autocomplete="off"' }) +
        feld("Serienart", "art", w, "text", { attr: 'list="arten" placeholder="z. B. Dialyse" maxlength="40" autocomplete="off"' }) + "</div>" +
        '<div class="korr-zeile">' + feld("Ziel", "ziel", w, "text", { cls: "breit2", opt: "Praxis, Dialyse, Klinik", attr: 'maxlength="80"' }) +
        feld("Telefon", "telefon", w, "tel", { opt: "für den Wochenanruf", attr: 'maxlength="60" placeholder="z. B. 02251 …"' }) + "</div>" +
        '<div class="feld-titel">Fahrplan</div>' +
        segment("rhythmus", w, [["woche", "Wöchentlich"], ["nwochen", "Alle N Wochen"], ["einzeln", "Einzelne Termine"]]) +
        (w.rhythmus === "einzeln" ? '<p class="hinweis-klein" style="margin:-0.2rem 0 0.7rem">Termine trägt die Dispo einzeln ein (Knopf „+ Termin“).</p>'
          : '<span class="label">Wochentage</span><div class="wt" data-feld="tage">' + S.WT_REIHE.map((n) => '<button type="button" data-v="' + n + '"' + (tage.indexOf(n) !== -1 ? ' class="an"' : "") + ">" + S.WT_KURZ[n] + "</button>").join("") + "</div>") +
        '<div class="korr-zeile">' + (w.rhythmus === "nwochen" ? feld("Alle … Wochen", "alleN", w, "number", { attr: 'min="2" max="12" inputmode="numeric"' }) : "") +
        auswahl("Fahrten je Termin", "richtung", w, [["beide", "Hin + Rück"], ["hin", "nur Hin"], ["rueck", "nur Rück"]]) +
        feld("Hinfahrt um", "hin", w, "time", { opt: "optional" }) + feld("Rückfahrt um", "rueck", w, "time", { opt: "optional" }) + "</div>" +
        '<div class="korr-zeile">' + feld("Serie ab", "ab", w, "date") + feld("Serie endet am", "ende", w, "date", { opt: "optional" }) + "</div>" +
        '<div class="feld-titel">Genehmigung &amp; Abrechnung</div>' +
        segment("abrechnung", w, [["kasse", "Kasse (DMRZ)"], ["privat", "Privat (DATEV)"]]) +
        '<div class="korr-zeile">' + feld("Kostenträger", "kostentraeger", w, "text", { cls: "breit", attr: 'placeholder="z. B. AOK Rheinland/Hamburg" maxlength="80"' }) + "</div>" +
        '<div class="korr-zeile">' + feld("Genehmigung von", "genVon", w, "date", { opt: "optional" }) + feld("bis", "genBis", w, "date", { opt: "optional" }) +
        feld("Genehmigte Fahrten", "genFahrten", w, "number", { opt: "optional", attr: 'min="1" inputmode="numeric"' }) + "</div>" +
        '<div class="korr-zeile">' + feld("Notiz", "notiz", w, "textarea", { cls: "breit", opt: "optional, keine Diagnosen" }) + "</div>" +
        '<div class="korr-vorschau" id="f-vorschau"></div>' +
        '<button type="button" class="knopf" id="f-speichern">' + (p ? "Änderungen speichern" : "Patient anlegen") + '</button><button type="button" class="neben-link" id="f-abbrechen">Abbrechen</button></div>';
    }

    function formBinden(p) {
      const f = $("form");
      if (!f) return;
      f.querySelectorAll(".segment, .chips").forEach((g) => g.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        const an = !b.classList.contains("an") || g.classList.contains("segment");
        g.querySelectorAll("button").forEach((x) => x.classList.remove("an"));
        if (an) b.classList.add("an");
        if (g.dataset.feld === "umfang" || g.dataset.feld === "rhythmus" || g.dataset.feld === "erreicht") { form.werte = formLesen(); rechts(); return; }
        vorschau(p);
      })));
      f.querySelectorAll(".wt button").forEach((b) => b.addEventListener("click", () => { b.classList.toggle("an"); vorschau(p); }));
      f.querySelectorAll("input, select, textarea").forEach((el) => el.addEventListener("input", () => vorschau(p)));
      $("f-abbrechen").addEventListener("click", () => { form = null; if (!p) gewaehlt = ""; zeichne(); });
      $("f-speichern").addEventListener("click", () => speichern(p));
      vorschau(p);
    }

    // vorschau = true: fehlender Grund stört die Vorschau noch nicht (erst beim Speichern)
    function entwurf(p, vorschau) {
      const w = formLesen();
      if (form.typ === "patient") return Object.assign(S.pruefePatient(Object.assign({}, w, { id: p ? p.id : "neu" })), { w: w });
      if (form.typ === "anruf") return Object.assign(S.pruefeEreignis({ patient: p.id, art: "anruf", von: w.von, grund: S.anrufGrund(w), notiz: w.notiz }), { w: w });
      return Object.assign(S.pruefeEreignis({ patient: p.id, art: form.typ, von: w.von, bis: form.typ === "ausfall" && w.umfang === "zeitraum" ? w.bis : w.von,
        richtung: w.richtung, grund: w.grund || (vorschau ? "–" : ""), ersatzFuer: w.ersatzFuer, notiz: w.notiz }), { w: w });
    }
    function tageListeText(liste) { return liste.length > 5 ? liste.slice(0, 4).map(S.tagKurz).join(", ") + " … " + S.tagKurz(liste[liste.length - 1]) : liste.map(S.tagKurz).join(", "); }

    function vorschau(p) {
      const v = $("f-vorschau");
      if (!v) return;
      const r = entwurf(p, true);
      if (form.typ === "patient") {
        if (r.fehler) { v.innerHTML = '<span class="warn">' + esc(r.fehler) + "</span>"; return; }
        const m = S.monat(r.patient, daten.ereignisse.filter((x) => p && x.patient === p.id), monat, daten.heute);
        v.innerHTML = r.patient.rhythmus === "einzeln" ? "Fahrten entstehen aus den eingetragenen Terminen."
          : esc(S.monatName(monat) + ": " + mz(m.fahrtTage, "Fahrtag", "Fahrtage") + " · " + mz(m.fahrten, "Fahrt", "Fahrten") + " nach Plan");
        return;
      }
      if (r.fehler) { v.innerHTML = '<span class="warn">' + esc(r.fehler) + "</span>"; return; }
      if (form.typ === "anruf") {
        const w = r.w;
        v.innerHTML = w.erreicht === "nein" ? '<span class="warn">Bleibt fällig, bitte später nochmal anrufen.</span>'
          : esc("Nächster Anruf fällig am " + S.tagKurz(S.plusTage(r.ereignis.von, S.ANRUF_TAGE))) +
            (w.termine === "Neue Termine" ? ' <span class="warn">· danach gleich die Termine eintragen</span>' : w.termine === "Änderung / Ausfall" ? ' <span class="warn">· danach gleich den Ausfall eintragen</span>' : "") +
            (w.fahrten === "Kritik" && !w.notiz ? ' <span class="warn">· bitte kurz notieren, was nicht gut war</span>' : "");
        return;
      }
      const e = Object.assign({}, r.ereignis, { id: "_neu" });
      const w = S.wirkung(p, daten.ereignisse.concat([e]), e);
      const ft = S.feiertag(e.von);
      if (form.typ === "ausfall") {
        v.innerHTML = w.ausfall ? "Fällt aus: " + esc(mz(w.ausfall, "Fahrt", "Fahrten") + " · " + tageListeText(w.tage)) + (ft ? ' <span class="warn">(' + esc(ft) + ")</span>" : "") + (form.werte && !formLesen().grund ? ' <span class="warn">· Grund wählen</span>' : "")
          : '<span class="warn">In diesem Zeitraum ist keine Fahrt geplant (' + esc(e.von === e.bis ? S.tagKurz(e.von) : S.tagKurz(e.von) + " – " + S.tagKurz(e.bis)) + ").</span>";
      } else {
        const neu = w.tage.filter((d) => d === e.von).length ? w.fahrten : 0;
        v.innerHTML = (neu ? "Zusätzlich: " + esc(mz(w.fahrten, "Fahrt", "Fahrten") + " am " + S.tagKurz(e.von)) : '<span class="warn">Am ' + esc(S.tagKurz(e.von)) + " ist die Fahrt schon geplant.</span>") +
          (e.ersatzFuer ? esc(" · fällt dafür aus: " + S.tagKurz(e.ersatzFuer)) + (w.ausfall ? "" : ' <span class="warn">(dort war keine Fahrt geplant)</span>') : "") +
          (ft ? ' <span class="warn">(' + esc(ft) + ")</span>" : "");
      }
    }

    async function speichern(p) {
      const r = entwurf(p);
      if (r.fehler) { $("f-vorschau").innerHTML = '<span class="fehl">' + esc(r.fehler) + "</span>"; return; }
      const body = form.typ === "patient" ? { aktion: "patient", op: p ? "aendern" : "neu", patient: Object.assign(r.patient, { id: p ? p.id : "" }) } : { aktion: "ereignis", op: "neu", ereignis: r.ereignis };
      // Nach dem Wochenanruf mit neuen Terminen oder Ausfall gleich das passende Formular öffnen, damit keine Fahrt verloren geht
      const folge = form.typ === "anruf" ? (r.w.termine === "Neue Termine" ? "fahrt" : r.w.termine === "Änderung / Ausfall" ? "ausfall" : "") : "";
      $("f-speichern").disabled = true;
      const ok = await schreibe(body);
      if (!ok && $("f-speichern")) $("f-speichern").disabled = false;
      if (ok && folge) {
        const pNeu = daten.patienten.find((x) => x.id === p.id);
        if (pNeu) { oeffneForm(folge, pNeu); toast(folge === "fahrt" ? "Anruf gespeichert. Jetzt die neuen Termine eintragen." : "Anruf gespeichert. Jetzt den Ausfall eintragen."); }
      }
    }

    async function schreibe(body) {
      body.passwort = speicherS(PW_SCHLUESSEL);
      $("laden").hidden = false;
      const r = await apiPost(body);
      $("laden").hidden = true;
      if (r && r.status === "ok") { form = null; uebernehmen(r); toast(r.meldung || "Gespeichert."); return true; }
      if (r && (r.status === "passwort" || r.status === "gesperrt")) { sperren(r.message); return false; }
      if ($("f-vorschau")) $("f-vorschau").innerHTML = '<span class="fehl">' + esc((r && r.message) || "Fehler beim Speichern.") + "</span>";
      else toast((r && r.message) || "Fehler beim Speichern.", true);
      return false;
    }

      $("app").hidden = true; $("pw-seite").hidden = false;
      $("pw-fehler").textContent = meldung || "";
      $("pw").value = ""; $("pw").focus();

    }

      $("pw-knopf").disabled = true; $("pw-fehler").textContent = "";
      const r = await apiPost({ aktion: "liste", passwort: pw });
      $("pw-knopf").disabled = false;
      if (r && r.status === "ok") {
        speicherS(PW_SCHLUESSEL, pw); $("pw").value = "";
        $("pw-seite").hidden = true; $("app").hidden = false; letzteEingabe = Date.now();

      } else { $("pw-fehler").textContent = (r && r.message) || "Fehler."; $("pw").select(); }

    $("sperren").addEventListener("click", () => sperren("Gesperrt."));

      b.disabled = false; b.classList.remove("dreht");

    $("vor").addEventListener("click", () => { monat = S.monatPlus(monat, -1); zeichne(); });
    $("nach").addEventListener("click", () => { monat = S.monatPlus(monat, 1); zeichne(); });

        if (b.passwort !== PW) return { status: "passwort", message: "Passwort falsch. (Demo: demo)" };
        if (b.aktion === "liste") return liste();
        if (b.aktion === "patient") {
          const r = S.pruefePatient(b.patient);
          if (r.fehler) return { status: "error", message: r.fehler };
          const p = r.patient;
          if (b.op === "neu") { p.id = "N" + Date.now().toString(36); p.angelegt = jetzt(); p.geaendert = ""; db.patienten.push(p); merken(); return liste({ meldung: p.name + " angelegt.", id: p.id }); }
          const i = db.patienten.findIndex((x) => x.id === p.id);
          if (i === -1) return { status: "error", message: "Patient nicht gefunden." };
          p.angelegt = db.patienten[i].angelegt; p.geaendert = jetzt(); db.patienten[i] = p; merken();
          return liste({ meldung: p.name + " gespeichert.", id: p.id });
        }
        if (b.aktion === "ereignis") {
          if (b.op === "loeschen") { const e = db.ereignisse.find((x) => x.id === b.id && !x.geloescht); if (!e) return { status: "error", message: "Eintrag nicht gefunden." }; e.geloescht = jetzt(); merken(); return liste({ meldung: "Eintrag gelöscht." }); }

          if (db.ereignisse.some((x) => !x.geloescht && x.patient === e.patient && x.art === e.art && x.von === e.von && x.bis === e.bis && x.richtung === e.richtung && (e.art !== "anruf" || x.grund === e.grund))) return { status: "doppelt", message: "Steht schon drin." };

        }
